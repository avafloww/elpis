[workspace]
members = [
  "crates/elpis-protocol",
  "crates/elpis-client",
  "crates/elpis-transport",
  "crates/elpis-journal",
  "crates/elpis-python",
  "crates/elpis-coordinator",
  "crates/elpis-executor",
  "crates/elpis-runtime",
  "crates/elpis-identity",
  "crates/elpis-link",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/avafloww/elpis"

[workspace.dependencies]
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
ring = "=0.17.14"
rustls = { version = "=0.23.37", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "=0.14.9", default-features = false, features = ["ring"] }
x509-parser = "=0.18.1"
rustix = { version = "=1.1.2", features = ["process"] }
zeroize = "=1.8.1"
ureq = { version = "=3.1.4", default-features = false, features = ["rustls"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "__rustls-tls"] }
tar = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }
