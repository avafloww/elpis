[workspace]
members = [
  "crates/elpis-protocol",
  "crates/elpis-python",
  "crates/elpis-executor",
  "crates/elpis-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/avafloww/elpis"

[workspace.dependencies]
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
