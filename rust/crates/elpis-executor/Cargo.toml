[package]
name = "elpis-executor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
embedded-python = ["dep:elpis-runtime"]

[dependencies]
elpis-coordinator = { path = "../elpis-coordinator" }
elpis-effects = { path = "../elpis-effects" }
elpis-identity = { path = "../elpis-identity" }
elpis-journal = { path = "../elpis-journal" }
elpis-link = { path = "../elpis-link" }
elpis-protocol = { path = "../elpis-protocol" }
elpis-python = { path = "../elpis-python" }
elpis-runtime = { path = "../elpis-runtime", optional = true }
base64.workspace = true
serde.workspace = true
hex.workspace = true
libc.workspace = true
ring.workspace = true
rustix.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[dev-dependencies]
elpis-client = { path = "../elpis-client" }
elpis-transport = { path = "../elpis-transport" }
rcgen = { workspace = true, features = ["x509-parser"] }
rustls.workspace = true
tempfile = "3"
tungstenite.workspace = true

[build-dependencies]
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
