      <use href="#elpis-light-long-petal" fill="url(#elpis-light-petal-gold)" transform="rotate(90 256 256)"/>
      <use href="#elpis-light-long-petal" fill="url(#elpis-light-petal-gold)" transform="rotate(180 256 256)"/>
      <use href="#elpis-light-long-petal" fill="url(#elpis-light-petal-gold)" transform="rotate(270 256 256)"/>

      <use href="#elpis-light-short-petal" fill="url(#elpis-light-petal-green)" transform="rotate(45 256 256)"/>
      <use href="#elpis-light-short-petal" fill="url(#elpis-light-petal-green)" transform="rotate(135 256 256)"/>
