<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Elpis icon, light theme</title>
  <desc id="desc">A living eight-petaled rosette growing from one continuous orbit.</desc>
  <defs>
    <radialGradient id="elpis-light-surface" cx="42%" cy="28%" r="82%">
      <stop offset="0" stop-color="#fbfbf6"/>
      <stop offset="0.58" stop-color="#f2f2e9"/>
      <stop offset="1" stop-color="#e7ece4"/>
    </radialGradient>
    <linearGradient id="elpis-light-thread" x1="101" y1="431" x2="429" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a76b0"/>
      <stop offset="0.34" stop-color="#5f86ba"/>
      <stop offset="0.66" stop-color="#5f9d7d"/>
      <stop offset="1" stop-color="#b3892f"/>
    </linearGradient>
    <linearGradient id="elpis-light-petal-gold" x1="256" y1="142" x2="256" y2="249" gradientUnits="userSpaceOnUse">
