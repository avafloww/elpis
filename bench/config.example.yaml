version: 1
default_provider: sol
generator_provider: sol
image: elpisbench:latest
concurrency: 3
allow_private_input: false
providers:
  sol: { provider_type: codex-oauth, model: gpt-5.6 }
  opus: { provider_type: anthropic-oauth, model: claude-opus-5 }
  outside-judge:
    provider_type: openai-compatible
    model: gemini-2.5-pro
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: replace-me
judges:
  - { id: blind-a, provider: sol, family: openai, teacher_pool: true }
  - { id: blind-b, provider: opus, family: anthropic, teacher_pool: true }
  - { id: blind-c, provider: outside-judge, family: google, teacher_pool: false }
