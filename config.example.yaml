# Elpis harness configuration.
#
# Copy to config.yaml and fill in. config.yaml is gitignored and should be
# mode 0600 — it holds live credentials.
#   cp config.example.yaml config.yaml && chmod 0600 config.yaml
#
# Every key below shows its default. Required keys are marked REQUIRED; the
# rest can be omitted entirely to take the default.

llm:
  # Which wire surface backs the brain LLM. Default: openai-compatible.
  #   openai-compatible  — api_key + base_url against an OpenAI-shaped endpoint.
  #   anthropic-oauth    — a Claude Pro/Max subscription over the native Anthropic
  #                        Messages API. Auth is an OAuth token: run
  #                        `npm run oauth-login` once, then set model below.
  #                        api_key is unused; base_url defaults to the Anthropic API.
  #                        See docs/anthropic-oauth.md.
  #   codex-oauth         — a ChatGPT Codex subscription over the Codex Responses
  #                        backend. Run `npm run oauth-login -- codex` once.
  #                        See docs/codex-oauth.md.
  provider_type: openai-compatible   # openai-compatible | anthropic-oauth | codex-oauth
  api_key: sk-...                    # REQUIRED for openai-compatible (unused for OAuth providers)
  base_url: https://api.openai.com/v1  # REQUIRED for openai-compatible — any OpenAI-compatible endpoint
  model: gpt-4o                      # REQUIRED — endpoint/provider model id
  # Context window, in tokens. Omit (or null) to probe <base_url>/models/info.
  # Set explicitly for endpoints that don't implement that route — it is then
  # the ONLY way the harness learns the window.
  context_size: null
  # Reasoning models: chain-of-thought goes to reasoning_content, not content.
  reasoning_effort: high             # none | low | medium | high
  external_thinking: false            # Codex Responses: force visible think tool, native reasoning off
  # stream_idle_timeout_ms: 60000      # no-meaningful-progress watchdog; default 60s external-thinking, 180s otherwise; 0 disables
  # call_timeout_ms: 120000            # whole-call fail-safe; default 120s external-thinking, 20m otherwise; 0 disables
  # Which API surface to speak. auto = try the OpenAI Responses API (preserves
  # encrypted reasoning across turns — significantly better for reasoning
  # models) and permanently fall back to Chat Completions when the endpoint
  # doesn't serve the route (404/405 flips outright; any other first-contact
  # failure probes chat and commits only if chat succeeds). responses | chat
  # force one surface, no fallback.
  api: auto
  # Responses path only. reasoning.summary: emit human-readable reasoning
  # summaries (stored as reasoning_content for the console/summarizer). Omit
  # to not send — some orgs/models reject the param.
  # reasoning_summary: auto           # auto | concise | detailed
  # Responses path only. reasoning.context: how much replayed reasoning the
  # endpoint renders into context (newer models, e.g. GPT-5.6). Omit = endpoint
  # default.
  # reasoning_context: all_turns      # current_turn | all_turns | auto
  # Subtracted from the context window to leave room for the reply.
  completion_reserve_tokens: 8192
  #
  # --- anthropic-oauth (Claude Pro/Max subscription) ---
  # To use a subscription instead of the above, run `npm run oauth-login` once,
  # then replace the whole llm block with just these two keys:
  #
  #   provider_type: anthropic-oauth
  #   model: claude-opus-4-8          # any Claude id (claude-sonnet-5, etc.)
  #
  # api_key/base_url are unused (base_url defaults to https://api.anthropic.com);
  # context_size is mapped from the model id (set it only for an unrecognized one);
  # api/reasoning_summary/reasoning_context are ignored on this path. Extended
  # thinking is enabled automatically; reasoning_effort IS used as the Claude
  # effort level (low|medium|high|xhigh|max; `none` omits it). See
  # docs/anthropic-oauth.md.
  #
  # --- codex-oauth (ChatGPT Codex subscription) ---
  # Enable device-code auth in ChatGPT settings, run
  # `npm run oauth-login -- codex`, then use:
  #
  #   provider_type: codex-oauth
  #   model: gpt-5.6-sol             # a model returned by Codex discovery
  #
  # api_key is unused. base_url is pinned to https://chatgpt.com/backend-api;
  # api: chat is unsupported. Context is discovered from /codex/models unless
  # context_size is set. See docs/codex-oauth.md.

operator:
  name: operator                     # Display name for console-authored speech
  pronouns: null                     # Optional free-text identity metadata
  discord_id: null                   # Discord user id authorized for slash commands

discord:
  bot_token: ...                     # REQUIRED
  # Bot application id for slash-command registration. Omit to derive it from
  # the bot token.
  application_id: null
  # Dedicated channel for harness-level error notices. null = log-only; errors
  # never fall back to a public room.
  error_channel_id: null
  # Exact raw Discord user ids whose messages/reactions are silently discarded
  # before attachment, PluralKit, transcript, context, or agent-visible logging.
  ignored_user_ids: []
  # Per-message budget for inlining small text attachments into the inbound
  # message. 0 disables inlining.
  attachment_inline_max_bytes: 32768
  # Batching interval for ambient (non-direct-tier) inbound messages, in ms.
  # 0 disables batching — every message wakes the loop immediately.
  ambient_tick_ms: 600000
  # Whether a room-context tick may send messages. false makes ambient turns
  # receive-only: memory/files/tools remain available, but every send is denied.
  ambient_allow_send: true
  # Attach the image of a custom emote/sticker the FIRST time it is used in
  # the current context window, so the agent reads the social cue instead of
  # guessing from `<:name:id>` markup. false disables the feature.
  emote_images: true
  # Keyframes extracted (ffmpeg) per ANIMATED emote/sticker so the agent can
  # comprehend the motion. Clamped to [1, 8]; 1 = a single static frame.
  # ffmpeg missing/failing degrades to the raw first frame automatically.
  emote_keyframes: 4
  # REQUIRED — every guild the bot lives in. Unlisted guilds are never heard.
  # default_tier controls unlisted channels and defaults to drop (the historical
  # exhaustive-allowlist behavior). Modes are drop, direct, social, and quiet.
  #
  # Outbound policy is independent and deny-only. Guild allow_send defaults true
  # and is a master gate. Explicit scalar channels imply allow_send: true;
  # policy objects can override it. Unlisted channels use default_allow_send,
  # which defaults false. Runtime mute/deafen may deny further, never re-enable.
  #
  # slug must be unique, lowercase, and not all-digits (^[a-z0-9][a-z0-9-]*$,
  # not ^\d+$) — it's the human-readable handle for the guild. quiet_hours is
  # "HHMM-HHMM" (24h, wraparound allowed, e.g. "2300-0900"); timezone is an
  # IANA name used to interpret it (defaults to host tz).
  guilds:
    - id: "111111111111111111"
      slug: home
      # Slash commands register per-guild and are all operator-gated (a
      # non-operator gets a refusal, not an effect) — but a guild with
      # commands registered is still one whose members can see and attempt
      # them, including /clear, which wipes the agent's entire working memory
      # across every server. Keep this true ONLY in the operator's own home
      # guild; leave it false everywhere else (see the friends guild below).
      slash_commands: true
      # Resolve PluralKit webhook proxies to their member name and suppress the
      # briefly-visible original message so one proxied send enters history once.
      # Adds a ~2.5s ingest hold for ordinary human messages in this guild so
      # slower proxy round-trips cannot let the original enter history first.
      pluralkit: false
      channels:
        "222222222222222222": direct
        "333333333333333333": social
    - id: "444444444444444444"
      slug: friends
      # Listen everywhere at the ambient cadence, but send only to one explicit
      # output room. This is the conservative digest-agent pattern.
      default_tier: social
      allow_send: true
      default_allow_send: false
      slash_commands: false
      quiet_hours: "2300-0900"
      timezone: America/New_York
      channels:
        "555555555555555555":
          tier: drop
          allow_send: true
        "666666666666666666": quiet

compaction:
  # Tokens of real context at which a compaction cycle triggers. Clamped at
  # boot to the real usable window.
  trigger_tokens: 180000
  # Verbatim tail kept unsummarized. Validated: 0 < keep < trigger.
  keep_tokens: 50000

memory:
  # MEMORY.md and individual people/*.md files above this estimated token count
  # are consolidated before boot injection and after later edits. 0 disables.
  consolidation_threshold_tokens: 32000
  # Desired post-consolidation size; must be positive and below the threshold.
  consolidation_target_tokens: 24000

heartbeat:
  interval_ms: 3600000               # base autonomous wake interval (1h); 0 disables
  max_interval_ms: 14400000          # upper bound for idle-tick backoff (4h)
  reflection_min_messages: 3         # min real user messages between reflection beats
  social_nudge_ms: 43200000          # reach-out nudge after this much outbound silence (12h); 0 disables

sandbox:
  sync_timeout_ms: 15000             # sync VM watchdog (kills while(true){})
  async_deadline_ms: 120000          # detach a run's promise into bg after this long
  preview_max_bytes: 16384
  log_max_bytes: 32768

# Optional built-in modules (kagi, bsky, browser, computer, motor) use
# exactly ONE selection policy:
#   enabled: [browser, computer]  # allowlist: only these are requested
#   disabled: [bsky, motor]       # denylist: all except these are requested
# An empty enabled list requests none. An empty disabled list requests all and
# preserves the normal default. Kagi/Bluesky still require credentials, and motor
# requires an active computer module.
modules:
  disabled: []

console:
  enabled: true
  # Exposes the canonical Mind graph to authenticated external MCP clients at
  # /mcp. Keep false unless the console is loopback-bound or behind TLS + auth.
  mcp_enabled: false
  port: 8787
  # Loopback-only by default: the console exposes full reasoning, every
  # conversation, and the journal. Set 0.0.0.0 to expose on all interfaces —
  # do that deliberately, or reach it over an SSH tunnel instead.
  host: 127.0.0.1

kagi:
  # Enables the search()/extract() sandbox globals. null = those globals throw.
  api_key: null

bluesky:
  # PDS host; any atproto-compatible PDS is accepted.
  service: https://bsky.social
  # Handle or DID, e.g. agent.example.com
  identifier: null
  # App password, not the account password.
  app_password: null

# Native bounded workers. Disabled until the fixed-template worker runtime and
# token-bound broker are deliberately enabled.
workers:
  enabled: false
  max_concurrent: 4
  # Loopback-only by default. This server exposes token-bound completion, Mind,
  # mailbox, and workspace-custody routes; callers cannot choose another model,
  # Mind root, worker identity, source path, or mailbox direction.
  server:
    enabled: false
    host: 127.0.0.1
    port: 8790
  # Optional clean Git repository exported at tracked HEAD before Pod creation.
  # Archives and returned artifacts are kept privately under DATA_DIR/elpis-data/workers.
  workspace:
    source_root: null
    max_source_bytes: 8388608
    max_artifact_bytes: 8388608
  # One operator-owned PodTemplate. The caller cannot override its image,
  # command, mounts, service account, resources, namespace, or security context.
  kubernetes:
    enabled: false
    namespace: elpis-workers
    template: elpis-worker
    container: worker
    broker_url: null
    kubectl_path: kubectl
    context: null

# Kubernetes-only residence secretary. The shared scoped listener must be
# enabled above; the secretary Pod receives only its token-bound broker URL.
secretary:
  enabled: false
  max_concurrent: 1
  kubernetes:
    namespace: elpis-residence
    template: elpis-secretary
    container: secretary
    broker_url: null
    kubectl_path: kubectl
    context: null

# Provider subscription-usage tracker (Elpis Console rail widget + /usage
# slash command). The provider is AUTO-DETECTED from llm.base_url (currently:
# Kimi, when base_url is api.kimi.com/coding/*) and reuses llm.api_key — no
# extra credentials. The whole section is optional.
# usage_tracker:
#   enabled: true            # false disables even when a provider matches
#   poll_interval_ms: 300000 # 5 minutes

paths:
  # REQUIRED. The inhabitant corpus/workspace root. Harness-owned runtime state lives under
  # elpis-data/. This remains the sandbox cwd, so relative writes land here.
  data_directory: ../data

log_level: info                      # debug | info | warn | error | silent

# --- alternate provider profile (uncomment to switch) ---
# llm:
#   api_key: sk-kimi-...
#   base_url: https://api.kimi.com/coding/v1
#   model: k3
#   context_size: 1048576
