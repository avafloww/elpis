apiVersion: v1
kind: PodTemplate
metadata:
  name: elpis-secretary
  namespace: elpis-residence
template:
  metadata:
    labels:
      app.kubernetes.io/name: elpis-secretary
      app.kubernetes.io/component: secretary
  spec:
    automountServiceAccountToken: false
    restartPolicy: Never
    activeDeadlineSeconds: 86400
    enableServiceLinks: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: secretary
        # Replace with an immutable Elpis image digest containing dist/secretary-main.js.
        image: ghcr.io/avafloww/elpis@sha256:REPLACE_ME
        imagePullPolicy: IfNotPresent
        command: ["node", "/opt/elpis/dist/secretary-main.js"]
        workingDir: /tmp
        env:
          - name: ELPIS_RESTRICTED
            value: "1"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: scratch
            mountPath: /tmp
    volumes:
      - name: scratch
        emptyDir:
          sizeLimit: 64Mi
