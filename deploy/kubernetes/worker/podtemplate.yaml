apiVersion: v1
kind: PodTemplate
metadata:
  name: elpis-worker
  namespace: elpis-workers
template:
  metadata:
    labels:
      app.kubernetes.io/name: elpis-worker
      app.kubernetes.io/component: worker
  spec:
    automountServiceAccountToken: false
    restartPolicy: Never
    activeDeadlineSeconds: 3600
    enableServiceLinks: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: worker
        # Replace with an immutable Elpis image digest containing dist/worker-main.js.
        image: ghcr.io/avafloww/elpis@sha256:REPLACE_ME
        imagePullPolicy: IfNotPresent
        command: ["node", "/opt/elpis/dist/worker-main.js"]
        workingDir: /workspace
        env:
          - name: ELPIS_RESTRICTED
            value: "1"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: data
            mountPath: /data
          - name: scratch
            mountPath: /tmp
    volumes:
      - name: workspace
        emptyDir: {}
      - name: data
        emptyDir: {}
      - name: scratch
        emptyDir: {}
