apiVersion: v1
kind: ServiceAccount
metadata:
  name: elpis-restart-broker
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elpis-restart-broker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elpis-restart-broker
subjects:
  - kind: ServiceAccount
    name: elpis-restart-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: elpis-restart-broker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elpis-restart-broker
  labels:
    app.kubernetes.io/name: elpis
    app.kubernetes.io/component: restart-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elpis
      app.kubernetes.io/component: restart-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elpis
        app.kubernetes.io/component: restart-broker
    spec:
      serviceAccountName: elpis-restart-broker
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: ghcr.io/avafloww/elpis:latest
          imagePullPolicy: Always
          command: ["node", "/opt/elpis/dist/k8s/restart-broker.js"]
          env:
            - name: ELPIS_BROKER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: elpis-restart-broker
spec:
  selector:
    app.kubernetes.io/name: elpis
    app.kubernetes.io/component: restart-broker
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elpis-restart-broker-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elpis
      app.kubernetes.io/component: restart-broker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elpis
              app.kubernetes.io/component: harness
      ports:
        - protocol: TCP
          port: 8080
