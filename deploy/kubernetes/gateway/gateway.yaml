apiVersion: v1
kind: Namespace
metadata:
  name: elpis-gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Service
metadata:
  name: elpis-gateway
  namespace: elpis-gateway
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: elpis-gateway
  ports:
    - name: http
      port: 8790
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elpis-gateway
  namespace: elpis-gateway
spec:
  serviceName: elpis-gateway
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elpis-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elpis-gateway
        app.kubernetes.io/component: control-plane
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: elpis-gateway:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8790
              protocol: TCP
          env:
            - name: ELPIS_GATEWAY_DATA_DIR
              value: /data/state
            - name: ELPIS_GATEWAY_LISTEN_HOST
              value: 0.0.0.0
            - name: ELPIS_GATEWAY_LISTEN_PORT
              value: "8790"
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 2
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: elpis-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
